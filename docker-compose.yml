services:
  human-relay:
    build: .
    restart: always
    # Approved commands run as root in this container; without NET_RAW they
    # cannot open packet sockets to read dashboard or MCP traffic (SECURITY.md).
    cap_drop:
      - NET_RAW
    ports:
      - "8080:8080"
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /root/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - relay-ssh:/root/.ssh-data
      - relay-data:/opt/human-relay/data
      # Mount target must match MHR_SSH_CONFIG if set, or /root/.ssh/config if unset
      - ./ssh_config:/root/.ssh/config:ro
      - ./scripts:/scripts

volumes:
  relay-ssh:
  relay-data:
