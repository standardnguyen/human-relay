name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - name: Install Go
        run: |
          curl -fsSL https://go.dev/dl/go1.24.1.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build binary
        run: go build -o human-relay .

      - name: Run unit tests
        run: go test -v -count=1 ./mcp/ ./executor/ ./whitelist/

      - name: Run integration tests
        run: HUMAN_RELAY_BIN=${{ github.workspace }}/human-relay go test -v -count=1 ./integration/...

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      # Deployment is site-specific (hosts, env rendering, cron) and lives outside
      # this repo. Provide an executable hook on your runner to enable deploys.
      - name: Site deploy hook
        run: if [ -x /opt/relay-site/ci-deploy.sh ]; then /opt/relay-site/ci-deploy.sh; else echo "no site hook installed; skipping deploy"; fi
